[package]
name = "cc3-native"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace: the Tauri shell (apps/cc3-desktop/src-tauri) is untouched.
[workspace]

[[bin]]
name = "cc3-native"
path = "src/main.rs"

[[bin]]
name = "cc3"
path = "src/bin/app.rs"

[[bin]]
name = "rpc_probe"
path = "src/bin/rpc_probe.rs"

[dependencies]
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = [
  "native",
  "launch",
  "macro",
  "hooks",
  "signals",
  "html",
] }
blitz-dom = "0.3.0-beta.4"
blitz-html = "0.3.0-beta.4"
blitz-paint = "0.3.0-beta.4"
blitz-traits = "0.3.0-beta.4"
parley = "0.12"
parley_engine = "0.12"
winit = "=0.31.0-beta.3"
ureq = { version = "3", default-features = false, features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
dioxus-native-dom = "0.8.0-alpha.3"
dioxus-ssr = "0.8.0-alpha.3"
tokio = { version = "1", default-features = false, features = ["time"] }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3

# Patched copies of Blitz (see docs/native/README.md, "Blitz-Anpassungen"): changes needed for
# pixel parity with Chromium live here, each marked with `CC3:` in the source.
[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }
blitz-html = { path = "vendor/blitz-html" }
blitz-paint = { path = "vendor/blitz-paint" }
blitz-traits = { path = "vendor/blitz-traits" }
stylo_taffy = { path = "vendor/stylo_taffy" }
parley_engine = { path = "vendor/parley_engine" }
stylo = { path = "vendor/stylo" }
